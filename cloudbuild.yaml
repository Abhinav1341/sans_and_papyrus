# Deploys the game from GitHub: a push to main that touches web/ builds web/Dockerfile and rolls it out
# to Cloud Run. Environment variables (SESSION_SECRET, GOOGLE_CLIENT_ID...) stay as set on the service.
substitutions:
  _REGION: asia-south1
  _SERVICE: sans-and-papyrus
  _IMAGE: asia-south1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/sans-and-papyrus

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${SHORT_SHA}", "-t", "${_IMAGE}:latest", "web"]

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "${_IMAGE}"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ["run", "deploy", "${_SERVICE}", "--image", "${_IMAGE}:${SHORT_SHA}", "--region", "${_REGION}", "--quiet"]

images: ["${_IMAGE}:${SHORT_SHA}"]
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
